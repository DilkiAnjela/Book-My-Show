<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CineBook | Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">

<!-- NAVBAR -->
<nav class="flex justify-between items-center px-10 py-4 bg-black/90">
  <h1 class="text-2xl font-bold text-red-500">🎬 Book My Show</h1>
  <div class="space-x-6">
    <a href="home.html" class="text-red-400">Home</a>
    <a href="movies.html" class="hover:text-red-400">Movies</a>
    <a href="login.html" class="bg-red-500 px-4 py-2 rounded hover:bg-red-600">Login</a>
  </div>
</nav>

<!-- HERO -->
<section class="relative h-[75vh] flex items-center justify-center bg-cover bg-center"
  style="background-image:url('https://images.unsplash.com/photo-1524985069026-dd778a71c7b4')">
  <div class="absolute inset-0 bg-black/70"></div>
  <div class="relative text-center max-w-2xl">
    <h2 class="text-5xl font-extrabold mb-4">Book Movies Instantly</h2>
    <p class="text-gray-300 mb-6">
      Select movies • Choose seats • Enjoy 🎟️
    </p>
    <a href="movies.html"
      class="bg-red-500 px-6 py-3 rounded-lg text-lg hover:bg-red-600">
      Browse Movies

  </div>
</section>

<!-- FEATURED -->
<section class="px-10 py-14">

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-8">

    <div class="bg-gray-800 rounded-xl overflow-hidden hover:scale-105 transition">
      <img src="https://m.media-amazon.com/images/I/71niXI3lxlL._AC_SY679_.jpg"
           class="h-72 w-full object-cover">
      <div class="p-4">
        <h4 class="text-xl font-semibold">Interstellar</h4>
        <p class="text-gray-400 text-sm">Sci-Fi • 2h 49m</p>
        <a href="movie-details.html"
           class="block text-center mt-4 bg-red-500 py-2 rounded hover:bg-red-600">
          View Details
        </a>
      </div>
    </div>

  </div>
</section>

<footer class="text-center py-6 bg-black text-gray-400">
  © 2026 Book My Show
</footer>

</body>
</html>
