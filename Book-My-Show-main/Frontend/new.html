<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>BookMyShow | Home</title>
</head>
<body class="bg-gray-900 text-white">
<nav class="bg-gray-800 p-4 sticky top-0 z-50 shadow-2xl">
    <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold text-red-500">BookMyShow</h1>
        <div class="space-x-6">
            <a href="/" class="hover:text-red-500">Home</a>
            <a href="/movies" class="hover:text-red-500">Movies</a>
            <a href="/login" class="bg-red-600 px-4 py-2 rounded-lg hover:bg-red-700 transition">Login</a>
        </div>
    </div>
</nav>

<header class="h-[400px] bg-gradient-to-r from-black to-gray-800 flex items-center px-10">
    <div>
        <h2 class="text-5xl font-extrabold mb-4">Experience Movies <br> Like Never Before</h2>
        <p class="text-gray-400 text-lg mb-6">Book tickets for the latest blockbusters in your city.</p>
        <a href="#now-showing" class="bg-red-600 px-8 py-3 rounded-full font-bold">Browse Movies</a>
    </div>
</header>

<section id="now-showing" class="container mx-auto py-12 px-4">
    <h3 class="text-2xl font-bold mb-8 border-l-4 border-red-600 pl-4">Now Showing</h3>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
        <div class="bg-gray-800 rounded-xl overflow-hidden shadow-lg transform hover:scale-105 transition">
            <img src="https://via.placeholder.com/300x400" alt="Movie" class="w-full h-64 object-cover">
            <div class="p-4">
                <h4 class="text-xl font-bold">Inception</h4>
                <p class="text-gray-400 text-sm">Sci-Fi | 2h 28m</p>
                <a href="/movie-details" class="block text-center mt-4 bg-red-600 py-2 rounded-lg text-sm font-bold">Book Now</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
