<!DOCTYPE html>
<html>
<head>
  <title>Theater & Screen Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-black min-h-screen p-6">
  <h1 class="text-2xl font-bold text-red-500 mb-8">🎬 Admin Panel</h1>
  <nav class="space-y-4">
    <a href="admin-dashboard.html" class="hover:text-red-400">Dashboard</a>
    <a href="movie-management.html" class="hover:text-red-400">Movies</a>
    <a href="theater-screen-management.html" class="text-red-400">Theaters & Screens</a>
    <a href="show-management.html" class="hover:text-red-400">Shows</a>
    <a href="seat-management.html" class="hover:text-red-400">Seats</a>
  </nav>
</aside>

<!-- CONTENT -->
<main class="flex-1 p-10">
  <h2 class="text-3xl font-bold mb-6">Theaters & Screens</h2>

  <div class="grid md:grid-cols-2 gap-6">

    <!-- THEATER SECTION -->
    <div class="bg-gray-800 p-6 rounded">
      <h3 class="text-xl font-semibold mb-4">Theaters</h3>

      <button onclick="openTheaterModal()"
              class="bg-green-500 px-3 py-1 rounded mb-3 hover:bg-green-600">
        + Add Theater
      </button>

      <div class="bg-gray-700 p-2 rounded flex justify-between mb-2">
        Galaxy Cinema
        <span class="text-blue-400 cursor-pointer">Edit</span>
      </div>
    </div>

    <!-- SCREEN SECTION -->
    <div class="bg-gray-800 p-6 rounded">
      <h3 class="text-xl font-semibold mb-4">Screens</h3>

      <button onclick="openScreenModal()"
              class="bg-green-500 px-3 py-1 rounded mb-3 hover:bg-green-600">
        + Add Screen
      </button>

      <div class="bg-gray-700 p-2 rounded">
        Screen 1 – 120 Seats
      </div>
    </div>

  </div>
</main>

<!-- ADD THEATER MODAL -->
<div id="theaterModal"
     class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center">

  <div class="bg-gray-800 p-6 rounded w-96">
    <h3 class="text-xl font-bold mb-4">Add Theater</h3>

    <form class="space-y-4">
      <input type="text" placeholder="Theater Name"
             class="w-full p-2 rounded bg-gray-700 focus:outline-none">

      <input type="text" placeholder="Location"
             class="w-full p-2 rounded bg-gray-700 focus:outline-none">

      <div class="flex justify-end gap-3">
        <button type="button" onclick="closeTheaterModal()"
                class="px-4 py-2 bg-gray-600 rounded">
          Cancel
        </button>
        <button type="button"
                class="px-4 py-2 bg-green-500 rounded hover:bg-green-600">
          Save
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ADD SCREEN MODAL -->
<div id="screenModal"
     class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center">

  <div class="bg-gray-800 p-6 rounded w-96">
    <h3 class="text-xl font-bold mb-4">Add Screen</h3>

    <form class="space-y-4">
      <input type="text" placeholder="Screen Name (e.g. Screen 1)"
             class="w-full p-2 rounded bg-gray-700 focus:outline-none">

      <input type="number" placeholder="Total Seats"
             class="w-full p-2 rounded bg-gray-700 focus:outline-none">

      <select class="w-full p-2 rounded bg-gray-700 focus:outline-none">
        <option>Select Theater</option>
        <option>Galaxy Cinema</option>
        <option>City Mall Cinema</option>
      </select>

      <div class="flex justify-end gap-3">
        <button type="button" onclick="closeScreenModal()"
                class="px-4 py-2 bg-gray-600 rounded">
          Cancel
        </button>
        <button type="button"
                class="px-4 py-2 bg-green-500 rounded hover:bg-green-600">
          Save
        </button>
      </div>
    </form>
  </div>
</div>

<!-- SCRIPT -->
<script>
  function openTheaterModal() {
    document.getElementById("theaterModal").classList.remove("hidden");
  }

  function closeTheaterModal() {
    document.getElementById("theaterModal").classList.add("hidden");
  }

  function openScreenModal() {
    document.getElementById("screenModal").classList.remove("hidden");
  }

  function closeScreenModal() {
    document.getElementById("screenModal").classList.add("hidden");
  }
</script>

</body>
</html>
